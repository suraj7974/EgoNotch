name: EgoNotch
options:
  minimumXcodeGenVersion: "2.44.0"
  projectFormat: xcode16_0          # required for syncedFolder (Xcode 16 buildable folders)
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

targets:
  EgoNotch:
    type: application
    platform: macOS

    sources:
      # Buildable folder: xcodebuild resolves contents at build time.
      # Adding/removing Swift files needs NO `xcodegen generate`.
      # Only project.yml changes require regeneration (Makefile does it automatically).
      - path: EgoNotch
        type: syncedFolder

    info:
      path: Config/Info.plist        # generated by xcodegen; gitignored
      properties:
        LSUIElement: true            # menu-bar agent: no Dock icon, no app switcher
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Suraj. Personal use."
        NSPrincipalClass: NSApplication
        # ---- Added by later phases: uncomment the line, run `make build` ----
        # NSAppleEventsUsageDescription: "EgoNotch controls media apps via AppleScript when MediaRemote is unavailable."
        # NSCameraUsageDescription: "EgoNotch uses the camera for the mirror widget."
        # NSCalendarsFullAccessUsageDescription: "EgoNotch shows your upcoming events in the notch."
        # NSLocationUsageDescription: "EgoNotch uses your location for the weather widget."
        # NSLocationWhenInUseUsageDescription: "EgoNotch uses your location for the weather widget."

    entitlements:
      path: Config/EgoNotch.entitlements   # generated by xcodegen; gitignored
      properties:
        com.apple.security.app-sandbox: false   # documents intent; sandbox must stay OFF
        # Future (only if ENABLE_HARDENED_RUNTIME is ever flipped to YES):
        # com.apple.security.automation.apple-events: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suraj.EgoNotch
        PRODUCT_NAME: EgoNotch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO          # plist comes from the info: block above

        # Swift 6 with Xcode 26 "approachable concurrency" defaults
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES

        # Personal app: sandbox and hardened runtime OFF (dlopen MediaRemote, CGEvent tap)
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

        # Signing: stable identity => stable TCC grants (Accessibility, Camera, ...)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7GYNAZ2QSZ
        CODE_SIGN_IDENTITY: Apple Development

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

    scheme:
      testTargets: []
      gatherCoverageData: false
