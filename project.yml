name: EgoNotch
options:
  minimumXcodeGenVersion: "2.44.0"
  projectFormat: xcode16_0          # required for syncedFolder (Xcode 16 buildable folders)
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  # Real xterm emulator for the Terminal tab — colors, cursor, alt-screen
  # apps (vim, htop), the lot. Rolling our own would be a toy.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.18.0"

targets:
  EgoNotch:
    type: application
    platform: macOS

    sources:
      # Buildable folder: xcodebuild resolves contents at build time.
      # Adding/removing Swift files needs NO `xcodegen generate`.
      # Only project.yml changes require regeneration (Makefile does it automatically).
      - path: EgoNotch
        type: syncedFolder

    dependencies:
      # Loaded inside /usr/bin/perl (Apple platform binary) to pass the
      # macOS 15.4+ MediaRemote entitlement gate. Embedded only — the app
      # process must NOT link it (dyld would fail on its install name).
      - target: EgoNotchMediaAdapter
        embed: true
        link: false
      - package: SwiftTerm

    info:
      path: Config/Info.plist        # generated by xcodegen; gitignored
      properties:
        LSUIElement: true            # menu-bar agent: no Dock icon, no app switcher
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Suraj. Personal use."
        NSPrincipalClass: NSApplication
        NSAppleEventsUsageDescription: "EgoNotch controls media apps via AppleScript when MediaRemote is unavailable."
        NSCalendarsFullAccessUsageDescription: "EgoNotch shows your upcoming events in the notch."
        NSCameraUsageDescription: "EgoNotch uses the camera for the recorder."
        NSMicrophoneUsageDescription: "EgoNotch records audio with your videos."

    entitlements:
      path: Config/EgoNotch.entitlements   # generated by xcodegen; gitignored
      properties:
        com.apple.security.app-sandbox: false   # documents intent; sandbox must stay OFF
        # Future (only if ENABLE_HARDENED_RUNTIME is ever flipped to YES):
        # com.apple.security.automation.apple-events: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suraj.EgoNotch
        PRODUCT_NAME: EgoNotch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO          # plist comes from the info: block above

        # Swift 6 with Xcode 26 "approachable concurrency" defaults
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES

        # Personal app: sandbox and hardened runtime OFF (dlopen MediaRemote, CGEvent tap)
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

        # Signing: stable identity => stable TCC grants (Accessibility, Camera, ...)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7GYNAZ2QSZ
        CODE_SIGN_IDENTITY: Apple Development

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

    scheme:
      testTargets: []
      gatherCoverageData: false

  # Tiny ObjC dylib that dlopens MediaRemote and streams now-playing JSON on
  # stdout / sends commands. It runs inside /usr/bin/perl, never in the app.
  EgoNotchMediaAdapter:
    type: library.dynamic
    platform: macOS
    sources:
      - path: MediaAdapter
    dependencies:
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_NAME: EgoNotchMediaAdapter
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7GYNAZ2QSZ
        CODE_SIGN_IDENTITY: Apple Development
